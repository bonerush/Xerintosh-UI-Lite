; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   https://docs.platformio.org/page/projectconf.html

[platformio]
; 所有 worktree 共享编译缓存，避免重复编译相同源文件
; 不同 worktree 的 .pio/build/ 仍独立，但对象文件缓存共享
build_cache_dir = ${platformio.core_dir}/cache/build

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_unflags = -fuse-cxa-atexit
board_build.partitions = partitions_singleapp_large.csv
build_flags =
    -std=gnu++17
    -Os
lib_deps =
    lovyan03/LovyanGFX@^1.1.12
    baracodadailyhealthtech/cJSON@^1.7.18

; Native test environment for desktop testing
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
    -std=c++17
    -D _XOPEN_SOURCE
    -D NATIVE_TEST
    -D CONFIG_PREEMPT_ENABLED
    -D SCREEN_WIDTH=80
    -D SCREEN_HEIGHT=160
    -Isrc
    -Wno-deprecated-declarations
lib_deps =
    google/googletest@^1.14.0
lib_compat_mode = off

; ESP32 native scheduler (Xeros kernel, no FreeRTOS scheduler)
[env:m5stick-c-native]
platform = espressif32
board = m5stick-c
framework = espidf
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_unflags = -fuse-cxa-atexit
board_build.partitions = partitions_singleapp_large.csv
build_flags =
    -std=gnu++17
    -Os
    -D XEROS_NATIVE_SCHED
    -D CONFIG_PREEMPT_ENABLED
lib_deps =
    lovyan03/LovyanGFX@^1.1.12
    baracodadailyhealthtech/cJSON@^1.7.18
