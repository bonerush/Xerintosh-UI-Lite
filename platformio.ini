; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   https://docs.platformio.org/page/projectconf.html

[platformio]
; 所有 worktree 共享编译缓存，避免重复编译相同源文件
; 不同 worktree 的 .pio/build/ 仍独立，但对象文件缓存共享
build_cache_dir = ${platformio.core_dir}/cache/build

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
lib_deps =
	m5stack/M5Unified@^0.2.14
	m5stack/M5GFX@^0.2.20
	bblanchon/ArduinoJson@^7.0.0
board_build.partitions = no_ota.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
	-std=c++17
	-Os
	-D CORE_DEBUG_LEVEL=0

; Native test environment for desktop testing
[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
	-std=c++17
	-D _XOPEN_SOURCE
	-D NATIVE_TEST
	-D SCREEN_WIDTH=80
	-D SCREEN_HEIGHT=160
	-Ilib/XerintoshUI/src
	-Isrc
	-Wno-deprecated-declarations
lib_deps =
	google/googletest@^1.14.0
lib_compat_mode = off
